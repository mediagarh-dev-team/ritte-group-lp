<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You – RITEE College of Nursing, Raipur</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
    <link rel="apple-touch-icon" href="images/logo.svg" />
    <meta name="theme-color" content="#1b1844" />

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Your application has been submitted. RITEE College of Nursing admissions team will contact you shortly."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://admission.riteegroup.in/thank-you" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@400,500,700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

    <style>
      :root {
        --ink: #1b1844;
        --blue: #383080;
        --red: #e31e24;
        --white: #fff;
        --tint: #f3f1fd;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: var(--tint);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: var(--white);
        border-radius: 28px;
        padding: 48px 40px 44px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(27, 24, 68, 0.12);
      }

      .icon-wrap {
        width: 80px;
        height: 80px;
        margin: 0 auto 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #e01820, #f4533f);
        color: var(--white);
        font-size: 32px;
      }

      .logo {
        display: inline-flex;
        width: 96px;
        padding: 6px;
        background: var(--tint);
        border-radius: 8px;
        margin-bottom: 32px;
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
      }

      h1 {
        font-family: 'Supreme', sans-serif;
        margin: 0 0 14px;
        font-size: clamp(26px, 5vw, 36px);
        font-weight: 700;
        line-height: 1.2;
        color: var(--ink);
      }

      p {
        margin: 0 0 32px;
        font-size: 16px;
        line-height: 1.7;
        color: #6b6896;
      }

      /* Submitted details summary */
      .user-details {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0 0 32px;
        padding: 20px 24px;
        background: var(--tint);
        border-radius: 16px;
        text-align: left;
      }
      .user-details .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 14px;
      }
      .user-details .row + .row {
        padding-top: 10px;
        border-top: 1px solid #e4e2f4;
      }
      .user-details .label {
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
      }
      .user-details .value {
        color: #6b6896;
        text-align: right;
        word-break: break-word;
      }
      @media (max-width: 480px) {
        .user-details .row {
          flex-direction: column;
          align-items: flex-start;
          gap: 2px;
        }
        .user-details .value {
          text-align: left;
        }
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 10px 10px 24px;
        background: linear-gradient(90deg, #e01820 0%, #f4533f 100%);
        color: var(--white);
        border: none;
        border-radius: 50px;
        font-family: 'Poppins', sans-serif;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: box-shadow 0.3s ease;
      }
      .btn-back:hover {
        color: var(--white);
        box-shadow: 0 8px 22px rgba(227, 30, 36, 0.35);
      }
      .btn-back-icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--white);
        color: var(--ink);
        font-size: 11px;
      }

      .footer-note {
        margin-top: 32px;
        font-size: 12px;
        color: #9c99be;
      }

      @media (max-width: 480px) {
        .card {
          padding: 36px 24px 32px;
        }
      }
    </style>

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TZVKVCQ2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <div class="card">
      <a href="/" class="logo" aria-label="RITEE Home">
        <img src="images/logo.svg" alt="RITEE College of Nursing" />
      </a>

      <div class="icon-wrap">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1>Application Submitted!</h1>
      <p>
        Thank you for your interest in RITEE College of Nursing.<br />
        Our admissions team will get in touch with you shortly.
      </p>

      <div class="user-details" id="userDetails">
        <div class="row">
          <span class="label">Full Name</span>
          <span class="value" id="detailName">—</span>
        </div>
        <div class="row">
          <span class="label">Phone Number</span>
          <span class="value" id="detailPhone">—</span>
        </div>
        <div class="row">
          <span class="label">Email Address</span>
          <span class="value" id="detailEmail">—</span>
        </div>
      </div>

      <a href="/" class="btn-back">
        Back to Home
        <span class="btn-back-icon"><i class="fa-solid fa-arrow-left"></i></span>
      </a>

      <p class="footer-note">RITEE College of Nursing, Raipur &bull; Est. 2008</p>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var name = params.get('name') || '';
        var phone = params.get('phone') || '';
        var email = params.get('email') || '';

        if (name) document.getElementById('detailName').textContent = decodeURIComponent(name);
        if (phone) document.getElementById('detailPhone').textContent = decodeURIComponent(phone);
        if (email) document.getElementById('detailEmail').textContent = decodeURIComponent(email);

        // If no params at all, hide the details block
        if (!name && !phone && !email) {
          document.getElementById('userDetails').style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
